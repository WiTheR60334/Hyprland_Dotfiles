BACKGROUND
background {
    path = ~/.config/hypr/p444.jpg
}

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 70
    outline_thickness = 2
    border_color=rgba(0,0,0,0)
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">Rehn de nhi khulega tujhse</span></i>
    hide_input = true
    position = 0, -400
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A" | tr '[:lower:]' '[:upper:]' | sed 's/./& /g')"
    # text = cmd[update:1000] echo -e "$(date +"%A, %d %B" | tr '[:lower:]' '[:upper:]')"    
    color = rgba(216, 222, 233, 0.80)
    font_size = 130
    font_family = Anurati
    position = 0, 240
    # position = 190, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 150
    font_family = Adwaita Sans, Heavy
    position = -15, -150
    halign = center
    valign = center
}

background {
    monitor =
    path = ~/.config/hypr/foreground.png
    zindex = 1
    # Force the image to fill the screen with smooth scaling
    scale = fit          # or 'fit' (preserves aspect ratio)
    filter = cubic       # or 'cubic' for smoother interpolation
}

